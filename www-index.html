<!-- Стартова сторінка учня. Копіюється в ~/www/index.html при створенні акаунта.
     Заняття 01: замінити назву продукту й ім'я, далі сторінка розвивається сама. -->
<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скоро тут буде сервіс</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, sans-serif; background: #f1f4f6; color: #131a21;
  }
  @media (prefers-color-scheme: dark) { body { background: #11161a; color: #e7ecef; } }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.9rem; margin: 0 0 .6rem; }
  p { line-height: 1.6; opacity: .8; }
  code { background: rgba(128,128,128,.18); padding: .1em .4em; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>Скоро тут буде сервіс</h1>
  <p>Це стартова сторінка учня <code>artem.g15</code>.</p>
  <p>
    На занятті 01 заміни заголовок на назву свого продукту й додай своє ім'я —
    саме це перевіряє автоматична перевірка. Прізвище не пиши: сторінка публічна.
  </p>
</main>
</body>
</html>
